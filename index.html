<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            color: white;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 32px;
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .tile {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #d3d6da;
            border-radius: 4px;
            background: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tile.filled {
            border-color: #b0b0b0;
            background: #f0f0f0;
        }

        .tile.correct {
            background: #6aaa64;
            border-color: #6aaa64;
            color: white;
            transform: scale(1.05);
        }

        .tile.present {
            background: #b59f3b;
            border-color: #b59f3b;
            color: white;
            transform: scale(1.05);
        }

        .tile.absent {
            background: #787c7e;
            border-color: #787c7e;
            color: white;
            transform: scale(1.05);
        }

        .keyboard {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            flex: 1;
            max-width: 40px;
            padding: 10px;
            border: 1px solid #d3d6da;
            border-radius: 4px;
            background: #f3f3f3;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 12px;
        }

        .key:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .key:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .key.correct {
            background: #6aaa64;
            color: white;
            border-color: #6aaa64;
        }

        .key.present {
            background: #b59f3b;
            color: white;
            border-color: #b59f3b;
        }

        .key.absent {
            background: #787c7e;
            color: white;
            border-color: #787c7e;
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .message {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin-bottom: 16px;
            min-height: 24px;
        }

        .message.error {
            color: #ff6b6b;
        }

        .message.success {
            color: #6aaa64;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        .modal-content h2 {
            font-size: 32px;
            margin-bottom: 16px;
            color: #667eea;
        }

        .modal-content p {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-content .answer {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .stats {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 36px;
            }

            .tile {
                font-size: 20px;
            }

            .key {
                max-width: 35px;
                padding: 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WORDLE 2</h1>
            <p>Guess the word in 6 tries</p>
        </div>

        <div class="message" id="message"></div>

        <div class="game-board" id="gameBoard"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
            <button class="btn-primary" onclick="game.newGame()">New Game</button>
            <button class="btn-secondary" onclick="game.showStats()">Stats</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalText"></p>
            <div class="answer" id="modalAnswer" style="display: none;"></div>
            <div class="stats" id="modalStats"></div>
            <button class="btn-primary" onclick="game.newGame(); document.getElementById('modal').classList.remove('active')">Play Again</button>

    </div>

            'HOUSEFLY', 'HOUSEFUL', 'HOUSEFULS', 'HOUSEHOLD', 'HOUSEHOLDS', 'HOUSEKEEPER', 'HOUSEKEEPERS', 'HOUSEKEEPING', 'HOUSEKEEPER',
            'HOUSELEEK', 'HOUSELEEKS', 'HOUSELESS', 'HOUSELIGHTS', 'HOUSELIKE', 'HOUSELINE', 'HOUSELINES', 'HOUSEMAID', 'HOUSEMAIDS',
            'HOUSEMAN', 'HOUSEMEN', 'HOUSEMISTRESS', 'HOUSEMISTRESSES', 'HOUSES', 'HOUSESAT', 'HOUSESIT', 'HOUSESITS', 'HOUSESITTER',
            'HOUSESITTERS', 'HOUSESTATE', 'HOUSESTATES', 'HOUSEWARES', 'HOUSEWARE', 'HOUSEWARES', 'HOUSEWIFELY', 'HOUSEWIFE',
            'HOUSEWIFES', 'HOUSEWIFING', 'HOUSEWIFRIES', 'HOUSEWIFRIES', 'HOUSEWIFRY', 'HOUSEWIFRY', 'HOUSEWIFVES', 'HOUSEWORK',
            'HOUSEWORKS', 'HOUSEY', 'HOUSING', 'HOUSINGS', 'HOVEL', 'HOVELED', 'HOVELING', 'HOVELLED', 'HOVELLING', 'HOVELS',
            'HOVER', 'HOVERED', 'HOVERING', 'HOVERS', 'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT',
            'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT', 'HOVERCRAFT'
        ];

        class Wordle {
            constructor() {
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.guesses = [];
                this.currentGuess = '';
                this.gameOver = false;
                this.won = false;
                this.stats = {
                    played: localStorage.getItem('wStats') ? JSON.parse(localStorage.getItem('wStats')).played : 0,
                    won: localStorage.getItem('wStats') ? JSON.parse(localStorage.getItem('wStats')).won : 0,
                };
                this.renderBoard();
                this.renderKeyboard();
                this.setupKeyboardListener();
            }

            setupKeyboardListener() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;
                    if (/^[a-z]$/i.test(e.key)) {
                        this.guessLetter(e.key.toUpperCase());
                    } else if (e.key === 'Backspace') {
                        this.backspace();
                    } else if (e.key === 'Enter') {
                        this.submitGuess();
                    }
                });
            }

            guessLetter(letter) {
                if (this.currentGuess.length < 5) {
                    this.currentGuess += letter;
                    this.renderBoard();
                }
            }

            backspace() {
                this.currentGuess = this.currentGuess.slice(0, -1);
                this.renderBoard();
            }

            submitGuess() {
                if (this.currentGuess.length !== 5) {
                    this.showMessage('Not enough letters', 'error');
                    return;
                }

                if (!WORDS.includes(this.currentGuess)) {
                    this.showMessage('Not in word list', 'error');
                    return;
                }

                this.guesses.push(this.currentGuess);
                this.currentGuess = '';
                this.renderBoard();
                this.renderKeyboard();

                if (this.guesses[this.guesses.length - 1] === this.word) {
                    this.won = true;
                    this.gameOver = true;
                    this.stats.played++;
                    this.stats.won++;
                    localStorage.setItem('wStats', JSON.stringify(this.stats));
                    setTimeout(() => this.showEndModal(true), 600);
                } else if (this.guesses.length === 6) {
                    this.gameOver = true;
                    this.stats.played++;
                    localStorage.setItem('wStats', JSON.stringify(this.stats));
                    setTimeout(() => this.showEndModal(false), 600);
                }
            }

            getLetterState(letter, position) {
                if (this.word[position] === letter) return 'correct';
                if (this.word.includes(letter)) return 'present';
                return 'absent';
            }

            renderBoard() {
                const board = document.getElementById('gameBoard');
                board.innerHTML = '';

                for (let i = 0; i < 6; i++) {
                    for (let j = 0; j < 5; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';

                        if (i < this.guesses.length) {
                            const letter = this.guesses[i][j];
                            const state = this.getLetterState(letter, j);
                            tile.textContent = letter;
                            tile.classList.add(state);
                        } else if (i === this.guesses.length) {
                            tile.textContent = this.currentGuess[j] || '';
                            if (this.currentGuess[j]) tile.classList.add('filled');
                        }

                        board.appendChild(tile);
                    }
                }
            }

            renderKeyboard() {
                const keyboard = document.getElementById('keyboard');
                const rows = [
                    ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                    ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                    ['Z', 'X', 'C', 'V', 'B', 'N', 'M'],
                ];

                keyboard.innerHTML = '';

                rows.forEach((row) => {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'keyboard-row';

                    row.forEach((letter) => {
                        const key = document.createElement('button');
                        key.className = 'key';
                        key.textContent = letter;

                        let state = '';
                        for (const guess of this.guesses) {
                            const index = guess.indexOf(letter);
                            if (index !== -1) {
                                const s = this.getLetterState(letter, index);
                                if (s === 'correct') {
                                    state = 'correct';
                                    break;
                                } else if (s === 'present' && state !== 'correct') {
                                    state = 'present';
                                }
                            }
                        }

                        if (state) {
                            key.classList.add(state);
                            key.disabled = true;
                        }

                        key.onclick = () => {
                            if (!this.gameOver) {
                                this.guessLetter(letter);
                            }
                        };

                        rowEl.appendChild(key);
                    });

                    keyboard.appendChild(rowEl);
                });
            }

            showMessage(text, type = '') {
                const message = document.getElementById('message');
                message.textContent = text;
                message.className = `message ${type}`;
                setTimeout(() => {
                    message.className = 'message';
                }, 2000);
            }

            showEndModal(won) {
                const modal = document.getElementById('modal');
                const title = document.getElementById('modalTitle');
                const text = document.getElementById('modalText');
                const answer = document.getElementById('modalAnswer');
                const stats = document.getElementById('modalStats');

                if (won) {
                    title.textContent = '🎉 You Won!';
                    title.style.color = '#6aaa64';
                    text.textContent = `You guessed the word in ${this.guesses.length} ${this.guesses.length === 1 ? 'try' : 'tries'}!`;
                } else {
                    title.textContent = 'Game Over';
                    title.style.color = '#c9b457';
                    text.textContent = 'Better luck next time!';
                    answer.style.display = 'block';
                    answer.textContent = `The word was: ${this.word}`;
                }

                const winRate = this.stats.played > 0 ? Math.round((this.stats.won / this.stats.played) * 100) : 0;
                stats.innerHTML = `
                    <div><strong>Played:</strong> ${this.stats.played}</div>
                    <div><strong>Won:</strong> ${this.stats.won}</div>
                    <div><strong>Win Rate:</strong> ${winRate}%</div>
                `;

                modal.classList.add('active');
            }

            showStats() {
                const modal = document.getElementById('modal');
                const title = document.getElementById('modalTitle');
                const text = document.getElementById('modalText');
                const answer = document.getElementById('modalAnswer');
                const stats = document.getElementById('modalStats');

                title.textContent = 'Statistics';
                title.style.color = '#667eea';
                text.textContent = 'Your Wordle stats:';
                answer.style.display = 'none';

                const winRate = this.stats.played > 0 ? Math.round((this.stats.won / this.stats.played) * 100) : 0;
                stats.innerHTML = `
                    <div><strong>Played:</strong> ${this.stats.played}</div>
                    <div><strong>Won:</strong> ${this.stats.won}</div>
                    <div><strong>Win Rate:</strong> ${winRate}%</div>
                `;

                modal.classList.add('active');
            }

            newGame() {
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.guesses = [];
                this.currentGuess = '';
                this.gameOver = false;
                this.won = false;
                document.getElementById('message').className = 'message';
                document.getElementById('message').textContent = '';
                this.renderBoard();
                this.renderKeyboard();
            }
        }

        const game = new Wordle();
    </script>
</body>
</html>
